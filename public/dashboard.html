<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>

  <body>
    <div class="sidebar">
      <h2>WORK CONTENT ELECTRONIC</h2>
      <a href="dashboard.html">Dashboard</a>
      <a href="records.html">Records</a>
      <a href="index.html">Logout</a>
    </div>

    <div class="main">
      <div class="header">
        <h1>Dashboard</h1>
        <h3 id="teamName"></h3>
      </div>

      <div class="cards" style="display: flex; gap: 20px">
        <div class="card">
          <h2>Total Task (This Week)</h2>
          <p id="totalWeek">0</p>
        </div>
        <div class="card">
          <h2>Total Task (This Month)</h2>
          <p id="totalMonth">0</p>
        </div>
      </div>

      <!-- Layout 2 Kolum: Kiri (Form) & Kanan (Saved Items Table) -->
      <div class="dashboard-container">
        <!-- Table Kiri: Form Intake -->
        <form class="form-card" id="workContentForm">
          <h2>Work Content</h2>

          <label>Task</label>
          <input type="text" id="task" />

          <label>Date</label>
          <input type="date" id="date" />

          <!-- Input Items Biasa (Fill Sahaja) -->
          <label>Items</label>
          <input type="text" id="itemInput" placeholder="Enter item name" />
          <div class="btn-group">
            <button
              type="button"
              class="btn-secondary"
              onclick="saveCurrentItem()"
            >
              Save Item
            </button>
            <button
              type="button"
              class="btn-secondary"
              onclick="addNewItemRow()"
            >
              Add Item
            </button>
          </div>

          <!-- Input Serial Number Biasa -->
          <label>Serial Number</label>
          <input type="text" id="serial" placeholder="Enter serial number" />
          <div class="btn-group">
            <button
              type="button"
              class="btn-secondary"
              onclick="saveCurrentSerial()"
            >
              Save Serial Number
            </button>
            <button
              type="button"
              class="btn-secondary"
              onclick="addNewSerialRow()"
            >
              Add Serial Number
            </button>
          </div>

          <label>Train ID</label>
          <div
            class="train-selector-container"
            style="position: relative; width: 100%; margin-bottom: 15px"
          >
            <button
              type="button"
              id="trainBtn"
              onclick="toggleTrainDropdown(event)"
              style="
                width: 100%;
                padding: 12px;
                text-align: left;
                background: white;
                border: 1px solid #ccc;
                border-radius: 8px;
                cursor: pointer;
                font-family: inherit;
                font-size: 16px;
              "
            >
              Select Train ID
            </button>
            <div
              id="trainDropdown"
              style="
                display: none;
                position: absolute;
                z-index: 100;
                background: white;
                border: 1px solid #ccc;
                box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.15);
                width: 100%;
                max-height: 200px;
                overflow-y: auto;
                padding: 12px;
                border-radius: 8px;
                box-sizing: border-box;
              "
            >
              <div
                id="trainGrid"
                style="
                  display: grid;
                  grid-template-columns: repeat(6, 1fr);
                  gap: 6px;
                "
              ></div>
            </div>
          </div>

          <div
            id="selectedTrainsContainer"
            style="
              display: flex;
              flex-wrap: wrap;
              gap: 8px;
              margin-bottom: 20px;
              min-height: 20px;
            "
          ></div>

          <label>Person In Charge</label>
          <div
            id="picContainer"
            style="
              display: flex;
              flex-wrap: wrap;
              gap: 8px;
              margin-top: 6px;
              margin-bottom: 20px;
            "
          ></div>

          <div style="text-align: center; margin-top: 20px">
            <button
              type="button"
              onclick="submitWorkAndRefresh(event)"
              style="
                background: #c8102e;
                color: white;
                padding: 12px 24px;
                border: none;
                border-radius: 8px;
                font-weight: bold;
                cursor: pointer;
              "
            >
              SAVE DATA
            </button>
          </div>
        </form>

        <!-- Table Kanan: List Saved Items & Serial Numbers -->
        <div class="saved-items-card">
          <div id="savedItemsList" class="saved-items-container">
            <!-- Dynamic Rows / Card pasangan Item & Serial Number akan dimasukkan di sini oleh JS -->
          </div>
        </div>
      </div>

      <footer
        style="
          text-align: center;
          padding: 20px 0;
          margin-top: 40px;
          width: 100%;
          font-family: Tahoma, sans-serif;
          font-size: 14px;
          color: #64748b;
          font-weight: bold;
        "
      >
        Developed by MSA22645 - MUHAMMAD SYAFIQ
      </footer>
    </div>

    <script src="js/dashboard.js"></script>
  </body>
</html>
