<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>

  <body>
    <div class="sidebar">
      <h2>WORK CONTENT ELECTRONIC</h2>
      <a href="dashboard.html">Dashboard</a>
      <a href="records.html">Records</a>
      <a href="index.html">Logout</a>
    </div>

    <div class="main">
      <div class="header">
        <h1>Dashboard</h1>
        <h3 id="teamName"></h3>
      </div>

      <div class="cards" style="display: flex; gap: 20px">
        <div class="card">
          <h2>Total Task (This Week)</h2>
          <p id="totalWeek">0</p>
        </div>
        <div class="card">
          <h2>Total Task (This Month)</h2>
          <p id="totalMonth">0</p>
        </div>
      </div>

      <div class="dashboard-container">
        <!-- Left Table: Intake Form -->
        <form class="form-card" id="workContentForm">
          <h2>Work Content</h2>

          <label>Task <span class="required-badge">!</span></label>
          <input type="text" id="task" class="pill-input" />

          <label>Date <span class="required-badge">!</span></label>
          <input type="date" id="date" class="pill-input" />

          <label>Items and Serial Number</label>
          <div class="in-out-group">
            <button
              type="button"
              class="btn-in-out"
              onclick="openItemModal('IN')"
            >
              IN
            </button>
            <button
              type="button"
              class="btn-in-out"
              onclick="openItemModal('OUT')"
            >
              OUT
            </button>
          </div>

          <button
            type="button"
            class="btn-add-more"
            onclick="commitCurrentAndReset()"
          >
            Add More
          </button>

          <label style="margin-top: 15px">Train ID</label>
          <div class="train-selector-container">
            <button
              type="button"
              id="trainBtn"
              class="pill-input"
              onclick="toggleTrainDropdown(event)"
              style="text-align: left; cursor: pointer; background: white"
            >
              Select Train ID
            </button>
            <div id="trainDropdown" class="train-dropdown">
              <div id="trainGrid" class="train-grid"></div>
            </div>
          </div>

          <div
            id="selectedTrainsContainer"
            class="selected-trains-container"
          ></div>

          <label style="text-align: center; display: block; width: 100%"
            >Person In Charge</label
          >
          <div id="picContainer" class="pic-container"></div>

          <hr class="section-divider" />

          <h3 class="report-title">Report</h3>

          <div class="report-flex-container">
            <div class="report-col">
              <label
                >Finding Problem <span class="required-badge">!</span></label
              >
              <textarea
                id="findingProblem"
                class="pill-textarea"
                placeholder="State the problem.."
                onfocus="expandReportTextarea(this)"
                onblur="shrinkReportTextarea(this)"
              ></textarea>
            </div>
            <div class="report-col">
              <label
                >Troubleshoot Method
                <span class="required-badge">!</span></label
              >
              <textarea
                id="troubleshootMethod"
                class="pill-textarea"
                placeholder="State the method.."
                onfocus="expandReportTextarea(this)"
                onblur="shrinkReportTextarea(this)"
              ></textarea>
            </div>
          </div>

          <div class="file-upload-section">
            <div class="file-upload-box">
              <span>Before</span>
              <div class="upload-area" onclick="triggerFileInput('fileBefore')">
                <input
                  type="file"
                  id="fileBefore"
                  accept="image/*"
                  onchange="handleFileChange(event, 'previewBefore')"
                  hidden
                />
                <div id="previewBefore" class="file-preview-content">
                  <div class="plus-icon">+</div>
                  <small>Add File</small>
                </div>
              </div>
            </div>

            <div class="file-upload-box">
              <span>After</span>
              <div class="upload-area" onclick="triggerFileInput('fileAfter')">
                <input
                  type="file"
                  id="fileAfter"
                  accept="image/*"
                  onchange="handleFileChange(event, 'previewAfter')"
                  hidden
                />
                <div id="previewAfter" class="file-preview-content">
                  <div class="plus-icon">+</div>
                  <small>Add File</small>
                </div>
              </div>
            </div>
          </div>

          <div style="text-align: center; margin-top: 25px">
            <button
              type="button"
              class="btn-save-main"
              onclick="submitWorkAndRefresh(event)"
            >
              SAVE DATA
            </button>
          </div>
        </form>

        <!-- Right Table: Saved Items Display -->
        <div class="saved-items-card">
          <div id="savedItemsList" class="saved-items-container"></div>
          <div style="text-align: center; margin-top: auto; padding-top: 20px">
            <button
              type="button"
              class="btn-edit-data"
              onclick="toggleEditMode()"
            >
              EDIT DATA
            </button>
          </div>
        </div>
      </div>

      <footer>Developed by MSA22645 - MUHAMMAD SYAFIQ</footer>
    </div>

    <!-- Modal for IN / OUT Item & Serial Number -->
    <div id="itemModal" class="modal-backdrop" style="display: none">
      <div class="modal-card">
        <h3 id="modalTitle">Item In</h3>
        <label id="lblItemName">Item In</label>
        <input type="text" id="modalItemInput" class="pill-input" />
        <label id="lblSerialName">Serial Number In</label>
        <input type="text" id="modalSerialInput" class="pill-input" />
        <div class="modal-btn-row">
          <button
            type="button"
            class="btn-modal-action"
            onclick="saveItemModalData()"
          >
            OK
          </button>
          <button
            type="button"
            class="btn-modal-cancel"
            onclick="closeItemModal()"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>

    <!-- Modal for Coach Number Selection -->
    <div id="coachModal" class="modal-backdrop" style="display: none">
      <div class="modal-card" style="text-align: center">
        <h3>Coach Number</h3>
        <div class="coach-grid">
          <button type="button" class="btn-coach" onclick="selectCoach('M1')">
            M1
          </button>
          <button type="button" class="btn-coach" onclick="selectCoach('T1')">
            T1
          </button>
          <button type="button" class="btn-coach" onclick="selectCoach('T2')">
            T2
          </button>
          <button type="button" class="btn-coach" onclick="selectCoach('M2')">
            M2
          </button>
        </div>
      </div>
    </div>

    <!-- Modal for Image Preview -->
    <div
      id="imagePreviewModal"
      class="modal-backdrop"
      style="display: none"
      onclick="closeImagePreview()"
    >
      <div
        class="modal-card"
        style="max-width: 500px; text-align: center"
        onclick="event.stopPropagation()"
      >
        <img
          id="previewImageSrc"
          src=""
          alt="Preview"
          style="max-width: 100%; border-radius: 12px"
        />
        <br />
        <button
          type="button"
          class="btn-modal-cancel"
          style="margin-top: 15px"
          onclick="closeImagePreview()"
        >
          Close
        </button>
      </div>
    </div>

    <script src="js/dashboard.js"></script>
  </body>
</html>
